name: SemanticPrism CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic>=2.6.0 PyYAML>=6.0.1 pandas>=2.0.0 pyarrow>=14.0.0 numpy>=1.26.0 ruff pytest

      - name: Check Python syntax & undefined names (ruff)
        run: ruff check --select E9,F63,F7,F82 src/ configs/ tests/ run_*.py model_config.py

      - name: Run CPU unit tests
        run: pytest -v tests/


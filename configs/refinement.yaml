# =========================================================================
# STAGE 2: LEXICAL REFINEMENT & TAXONOMIC LIFTING CONFIGURATION
# =========================================================================
# Controls SQLite term normalization caching, vector embeddings, and term
# deduplication clustering thresholds.
# =========================================================================

refinement:
  batch_size: 25               # Terms per API payload batch during lexical normalization
  timeout: 300.0               # Timeout limit in seconds per normalization API batch
  embedding_model: "all-MiniLM-L6-v2" # SentenceTransformers vector embedding model
  
  # Agglomerative Clustering Distance Threshold
  # Lower values (e.g. 0.5): Tighter, more precise clusters -> more numerous granular categories.
  # Higher values (e.g. 0.9): Broader, looser clusters -> fewer, higher-level abstract categories.
  clustering_threshold: 0.6

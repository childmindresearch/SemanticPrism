# =========================================================================
# STAGE 2: VECTOR CLUSTERING & TAXONOMIC LIFTING CONFIGURATION
# =========================================================================
# Controls vector embeddings, dimension-aware HDBSCAN clustering, and
# taxonomic hypernym lifting thresholds.
# =========================================================================

refinement:

  # =========================================================================
  # TAXONOMIC LIFTING & VECTOR CLUSTERING TOGGLES
  # =========================================================================
  # Controls SentenceTransformers vector clustering and LLM hypernym resolution.
  # Can be toggled independently for subjects, predicates, and objects.
  enable_taxonomic_lifting: true
  lift_subjects: true
  lift_predicates: false
  lift_objects: true

  embedding_model: "all-MiniLM-L6-v2"  # "BAAI/bge-large-en-v1.5" // SentenceTransformers vector embedding model for triplet hypernym lifting

  # =========================================================================
  # MASTER THEME CLUSTERING & SYNTHESIS SPECIFICATION
  # =========================================================================
  # Governs how raw extracted themes (all_themes.json) are partitioned into 
  # master domains prior to LLM synthesis.
  #
  # Clustering Mode Options:
  #   - "dynamic": Primary self-calibrating approach (Adaptive k-NN + Leiden community detection).
  #                Automatically determines the optimal number of natural master domains 
  #                based on corpus graph modularity without forcing an arbitrary count.
  #   - "fixed":   Variance-minimizing Ward Hierarchical clustering.
  #                Strictly partitions all themes into exactly 'target_master_theme_count' clusters.
  theme_clustering_mode: "dynamic"          # Selection: "dynamic" (Recommended) or "fixed"

  # Target cluster count K (used exclusively when theme_clustering_mode is set to "fixed")
  target_master_theme_count: 8              # Target number of master clusters for the 'fixed' option (Ward K)

  # Master Theme Synthesis Strategy
  #   - "map_reduce":   Two-Stage Map-Reduce (Recommended for large corpora). Deep per-cluster analysis 
  #                     followed by global contrastive harmonization with empirical anchor themes.
  #   - "single_stage": Traditional single-prompt synthesis using top N centroid exemplars.
  master_synthesis_strategy: "map_reduce"       # Selection: "map_reduce" (Recommended) or "single_stage"

  # Map Stage Parameters (Per-Cluster Specialist LLM — used when master_synthesis_strategy is 'map_reduce')
  theme_map_max_themes_per_cluster: 150         # Maximum cap of member themes passed per cluster in map stage
  theme_map_payload_format: "title_desc"        # Field length control: "title_desc" (recommended), "title", or "title_desc_reasoning"

  # Reduce Stage Parameters (Global Harmonization LLM — used when master_synthesis_strategy is 'map_reduce')
  reduce_anchor_theme_count: 5                  # Top N closest centroid themes passed as grounding context in reduce prompt

  # Legacy Single-Stage Fallback Parameters (used exclusively when master_synthesis_strategy is 'single_stage')
  theme_exemplars_per_cluster: 10               # Number of top exemplar themes per cluster sent to single-stage LLM prompt

  # Theme embedding model & payload format
  theme_embedding_model: "all-MiniLM-L6-v2"        # SentenceTransformers vector model for theme clustering
  theme_embedding_payload: "title_desc_reasoning" # Payload format: "title_desc_reasoning", "title_desc", or "title"

  # Theme Topological Manifold & Micro-Cluster Parameters
  theme_manifold_edge_threshold: 0.35           # Cosine similarity lower-bound to enforce strict semantic grounding in manifold graph
  theme_micro_cluster_ratio: 0.01               # Ratio of corpus size N below which micro-clusters are absorbed into dominant centroids

  # Theme Consolidation Multi-Tier Confidence Thresholds
  theme_confidence_high_threshold: 0.40     # Cosine score >= 0.40 -> High Confidence
  theme_confidence_medium_threshold: 0.25   # 0.25 <= Cosine score < 0.40 -> Medium Confidence
  theme_confidence_low_threshold: 0.15      # 0.15 <= Cosine score < 0.25 -> Low Confidence
  
  # =========================================================================
  # TWO-TIER VECTOR CLUSTERING & CACHING
  # =========================================================================
  vector_cache_dir: "outputs/02_refinement/cache" # Cache directory for .npy embeddings and _meta.json
  print_centroid_vector: true                     # Include centroid_vector in cluster JSON output
  plot_trustworthiness: true                      # Generates UMAP Trustworthiness vs n_components .jpg evaluation charts

  # Dimension-Aware Dynamic Parameter Calibration Matrix
  # (Sourced directly by resolve_clustering_params in refiner.py)
  calibration:
    # Tier A: Low-Dimensional Space (D <= 512, e.g. MiniLM 384d)
    low_dim:
      dim_ceiling: 512
      umap_n_neighbors: 20
      umap_min_dist: 0.00
      hdbscan_min_samples: 1
      hdbscan_selection: "eom"
      macro_linkage: "average"
      entity:
        rescue_tau: 0.32
        tau_macro: 0.48
      predicate:
        rescue_tau: 0.28
        tau_macro: 0.38

    # Tier B: Medium-Dimensional Space (512 < D <= 768, e.g. MPNet 768d)
    mid_dim:
      dim_ceiling: 768
      umap_n_neighbors: 15
      umap_min_dist: 0.03
      hdbscan_min_samples: 2
      hdbscan_selection: "eom"
      macro_linkage: "average"
      entity:
        rescue_tau: 0.26
        tau_macro: 0.36
      predicate:
        rescue_tau: 0.22
        tau_macro: 0.30

    # Tier C: High-Dimensional Space (D > 768, e.g. BGE-Large 1024d)
    high_dim:
      umap_n_neighbors: 15
      umap_min_dist: 0.05
      hdbscan_min_samples: 2
      hdbscan_selection: "leaf"
      macro_linkage: "complete"
      entity:
        rescue_tau: 0.18
        tau_macro: 0.22
      predicate:
        rescue_tau: 0.15
        tau_macro: 0.18



# =========================================================================
# STAGE 2: LEXICAL REFINEMENT & TAXONOMIC LIFTING CONFIGURATION
# =========================================================================
# Controls SQLite term normalization caching, vector embeddings, and term
# deduplication clustering thresholds.
# =========================================================================

refinement:
  batch_size: 25               # Terms per API payload batch during lexical normalization
  timeout: 300.0               # Timeout limit in seconds per normalization API batch
  embedding_model: "all-MiniLM-L6-v2" # SentenceTransformers vector embedding model
  
  # Agglomerative Clustering Distance Threshold
  # Lower values (e.g. 0.3): Tighter, more precise clusters -> more numerous granular categories.
  # Higher values (e.g. 0.9): Broader, looser clusters -> fewer, higher-level abstract categories.
  clustering_threshold: 0.4

  # =========================================================================
  # STAGE 2 PART 1: LEXICAL NORMALIZATION TOGGLES
  # =========================================================================
  # Toggles LLM lexical normalization pass. If disabled or component is false,
  # terms bypass normalization and no normalization JSON maps are created.
  enable_normalization: false
  normalize_subjects: false
  normalize_predicates: false
  normalize_objects: false

  # =========================================================================
  # STAGE 2 PART 2: TAXONOMIC LIFTING & VECTOR CLUSTERING TOGGLES
  # =========================================================================
  # Controls SentenceTransformers vector clustering and LLM hypernym resolution.
  # Can be toggled independently for subjects, predicates, and objects.
  enable_taxonomic_lifting: true
  lift_subjects: true
  lift_predicates: true
  lift_objects: true


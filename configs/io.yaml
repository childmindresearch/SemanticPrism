# =========================================================================
# INPUT / OUTPUT & INGESTION CONFIGURATION
# =========================================================================
# Controls directory locations, document ingestion settings, and pipeline
# execution modes.
# =========================================================================

pipeline:
  use_async: true
  resume_mode: "skip" # Options: "skip" (resume existing stage runs) or "overwrite" (clear stage outputs)

directories:
  inputs: "inputs/testdocs"
  outputs: "outputs"

ingestion:
  source_type: "parquet"   # Options: "directory" (text files) or "parquet" (dataset file)
  parquet:
    filename: "inputs/testdocs.parquet"
    id_field: "identifier"
    text_field: "anonymized"

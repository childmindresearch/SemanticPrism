# =========================================================================
# STAGE 3: GRAPH TOPOLOGY CONFIGURATION (Core-Separation & Community Architecture)
# =========================================================================
# Controls graph partitioning, community workflow discovery,
# architectural tier partitioning, and HTML canvas visual rendering.
# =========================================================================

topology:
  # Execution Mode for Stage 3 Topology Pipeline
  execution_mode: "community"
  # For Extracted THEMES: Threshold for discovering child -> parent theme inheritance links based on shared concepts.
  # Value range: 0.0 to 1.0 (e.g., 0.3 means a child theme must share >= 30% of its entities with a parent theme).
  # - Increase (e.g. 0.5): Stricter matching -> creates FEWER theme hierarchy links.
  # - Decrease (e.g. 0.1): Looser matching -> creates MORE theme hierarchy links.
  inheritance_overlap_threshold: 0.4
  # Export tabular CSV diagnostic reports (Complete graph, Top N Hubs, Pruned Subgraph, Communities)
  export_tabular_reports: true
  top_n_hubs_export: 30       # Minimum top hubs to export in registry (union of top N by degree and all flagged hubs; default 30)


  # =========================================================================
  # GLOBAL HUB PRUNING CONFIGURATION (Stage 3.1 & Stage 3.2 Universal Pruning)
  # =========================================================================
  # Evaluated on the complete graph before Stage 3.3 community partitioning.
  # Concepts meeting these thresholds are identified as systemic hubs,
  # pruned in Stage 3.2 to decouple modular communities, and routed to enums.py.
  hub_pruning:
    # Participation Coefficient (P_i) cutoff for extracting cross-community hub nodes.
    # Value range: 0.0 to 1.0 (Measures how evenly a concept bridges different themes).
    # - Increase (e.g. 0.8): Extract FEWER hubs (only concepts spanning many themes evenly).
    # - Decrease (e.g. 0.5): Extract MORE hubs (includes moderately connected concepts).
    participation_threshold: 0.80

    # Minimum total node degree required to qualify as a global hub.
    # Prevents low-degree peripheral concepts from being classified as structural hubs.
    min_hub_degree: 40

    # Shortest-path betweenness percentile cutoff for extracting workflow chokepoints.
    # Value range: 0.0 to 1.0 (e.g. 0.95 extracts concepts in top 1 - 0.95 = 5% betweenness).
    # - Increase (e.g. 0.98): Extract FEWER hubs (only top 2% critical workflow chokepoints).
    # - Decrease (e.g. 0.90): Extract MORE hubs (top 10% workflow chokepoints).
    betweenness_percentile: 0.95

  # =========================================================================
  # COMMUNITY PATH CONFIGURATION (Leiden Modularity Optimization)
  # =========================================================================
  community_path:
    leiden_resolution: 1.0        # Leiden modularity resolution density parameter

  # =========================================================================
  # SEMANTIC COMMUNITY ENHANCEMENT & STRICT SEPARATION CONFIGURATION
  # =========================================================================
  semantic_clustering:
    # 1. Strict Quarantine Safeguards
    quarantine_global_hubs: true           # Immutable invariant: Hubs pruned in 3.1/3.2 can NEVER enter communities
    quarantine_true_isolates: true         # Degree-0 nodes connected ONLY to global hubs stay in enums, never absorbed
    
    # 2. Weighted Leiden Modularity
    enable_weighted_leiden: true
    edge_weighting_mode: "hybrid"          # "frequency_only" or "hybrid" (combines frequency with cosine similarity)
    hybrid_semantic_alpha: 0.35            # Weight assigned to cosine similarity (0.0 = pure frequency, 1.0 = pure cosine)
    
    # 3. Centroid-Driven Micro-Cluster Absorption
    enable_micro_cluster_absorption: true
    min_absorption_similarity: 0.28        # Guardrail tau_min: Only absorb if cosine similarity to nearest centroid >= 0.28
    absorption_contrast_margin: 0.05       # Contrast margin: sim(best) - sim(second) >= 0.05 (Enhancement 1)
    absorption_size_threshold: 12          # Communities with fewer nodes than this threshold are candidates for absorption
    freeze_centroids_pre_absorption: true  # Prevent centroid drift during absorption
    
    # 4. Semantic Singleton Harvesting (Enhancement 2: High-Affinity Orphan Recovery)
    enable_singleton_harvesting: true      # High-confidence scan of unattached singletons/dyads
    singleton_harvesting_threshold: 0.40   # Strict high-confidence threshold (tau_harvest >= 0.40)
    singleton_contrast_margin: 0.05        # Contrast margin over second-best community (delta >= 0.05)
    
    # 5. Guarded Semantic Refugee Realignment
    enable_refugee_realignment: true
    refugee_margin_delta: 0.20             # sim(foreign) - sim(home) must exceed 0.20 to trigger reassignment
    require_structural_neighbor: true      # Must have at least 1 graph edge to candidate foreign community
    
    # 6. Pure Disjoint Triplet Partitioning (Zero Content Re-Use)
    triplet_payload_mode: "strictly_intra_only" # Strictly pure intra-community triplets only (subj in C AND obj in C)
    exclude_hub_triplets_from_communities: true # Any triplet containing a global hub is completely excluded
    
    # 7. Multi-Tier Confidence Thresholds
    confidence_thresholds:
      high: 0.40                           # Core Invariant (Eligible for root BaseModel)
      medium: 0.25                         # Relational Mechanic (Sub-model / Typed field)
      low: 0.15                            # Contextual Modifier (Filtered out or marked optional)

  # =========================================================================
  # ARCHITECTURAL TIER PARTITIONING (Hybrid Geometric-Topological Scoring)
  # =========================================================================
  # Computes topological tiering for offline diagnostics, 3D visualization,
  # and human-readable spreadsheet exports (community_architectural_tiers.csv):
  #   - Tier 1: Thematic Nucleus (Core Invariants)
  #   - Tier 2: Relational Mechanics (Domain Spokes)
  #   - Tier 3: Contextual Modifiers (Peripheral nuances)
  architectural_tiers:
    enabled: true

    # Composite Score Formulation:
    # S_u = (max(0, P_u))^w_proto * (D_u)^w_cent * (Gamma_u)^w_fid
    weights:
      prototypicality: 0.40      # Weight for cosine similarity to community centroid
      centrality: 0.40           # Weight for normalized internal community degree
      fidelity: 0.20             # Weight for contextual grounding to source quotes

    # Dynamic Percentile Cutoffs & Entity Bounds
    tier_1_percentile: 0.80      # Top 20% scoring concepts qualify for Tier 1
    tier_1_min_entities: 2       # Minimum entity count guaranteed for Tier 1
    tier_1_max_entities: 8       # Maximum cap for Tier 1 entities
    tier_2_percentile: 0.30      # Next 50% (30th to 80th percentile) form Tier 2
    # Tier 3 captures the remaining bottom 30% and all degree-1 leaves

    # Grounding Quality Safeguard
    min_fidelity_tier_1: 0.10    # Minimum average fidelity required to enter Tier 1

    # Human Evaluation & Reporting Exports
    export_tier_csv: true        # Exports human-readable spreadsheet (community_architectural_tiers.csv)
    export_diagnostics: true     # Exports summary stats (tier_partitioning_diagnostics.json)

  # =========================================================================
  # 3D GALAXY VISUALIZATION & EMBEDDING DE-BIASING
  # =========================================================================
  # Governs the 3D hyper-space galaxy projection (UMAP-3D & PCA-3D), cluster centroid
  # positioning, density hull boundaries, and cross-border refugee detection.
  galaxy_3d:
    # Vector de-biasing pre-processor (All-but-the-Top representation post-processing).
    # - true (default): Removes the global anisotropic background component (corpus mean vector μ
    #   and dominant principal components), centering the representation space and maximizing
    #   inter-cluster geometric separation across manifolds.
    # - false: Uses raw SentenceTransformer embeddings directly without de-biasing
    #   (preserves the standard raw vector cone where clusters share a global baseline direction).
    debias_embeddings: true

    # Weighting strategy for calculating 3D community centroid positions:
    # - "core_tiers" (default): Computes centroids using only Tier 1 (Nuclei) and Tier 2 (Mechanics)
    #   weighted by their composite architectural score. Prevents peripheral modifiers and
    #   generic low-degree concepts from pulling the cluster centroid back to the global center of mass.
    # - "tier_1_only": Anchors centroids strictly to Tier 1 Thematic Nuclei (falls back to Tier 2
    #   if no Tier 1 concepts exist in small communities).
    # - "uniform": Standard arithmetic mean across all community concepts (unweighted, equal
    #   weight across Tier 1, Tier 2, and Tier 3 modifiers).
    centroid_weighting: "core_tiers"

    # Percentile cutoff (integer from 50 to 95) for community density hull radii (R_p):
    # - 75 (default): Tight cohesive shells enclosing the core 75% of core community members;
    #   outlying modifiers orbit outside the hull as peripheral contextual nuance.
    # - 85: Standard statistical boundary enclosing the majority of community members.
    # - 95: Expansive boundary enclosing nearly all concepts including distant edge modifiers.
    density_hull_percentile: 75



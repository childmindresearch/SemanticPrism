# ==============================================================================
# STAGE 3: GRAPH ARCHITECTURE & TOPOLOGY CONFIGURATION
# ==============================================================================
# Governs graph partitioning, community workflow discovery, architectural tier
# partitioning, and HTML canvas visual rendering:
#
#   Section 0: Pipeline Execution & Tabular Diagnostic Reports
#   Section 1: Global Hub & Chokepoint Pruning (Stage 3.1: Core Separation)
#   Section 2: Community Modularity Optimization Baseline (Stage 3.2: Partitioning)
#   Section 3: Semantic Community Refinement & Strict Isolation (Stage 3.2: Boundary Refinement)
#   Section 4: Architectural Tier Partitioning (Stage 3.3: Nucleus / Mechanics / Nuance)
#   Section 5: 3D Galaxy Visualization & Manifold De-Biasing (Stage 3.4: Hyper-Space Projection)
# ==============================================================================

topology:
  # ----------------------------------------------------------------------------
  # SECTION 0: TUNING PARADIGM & MACRO DIALS
  # ----------------------------------------------------------------------------
  # Options:
  #   - "macro_dials": Self-calibrates the 50+ granular parameters below based on
  #                    dataset scale (|V|, |E|), edge density, and dynamic convergence.
  #   - "manual":      Uses the explicit granular parameters defined in Sections 1-5 verbatim.
  tuning_mode: "macro_dials"           # "macro_dials" (adaptive) or "manual" (explicit)

  macro_dials:
    # 1. Domain Granularity Intent (Target Schema Breadth & Count)
    #    "macro":    3-5 broad overarching schemas (e.g. lower resolution, eager agglomeration)
    #    "balanced": 5-8 cohesive domain schemas (recommended)
    #    "granular": 8-15 specialized micro-schemas
    domain_granularity: "balanced"

    # 2. Core Separation Profile (Strictness of Global Hub Pruning)
    #    "conservative": Prunes only extreme statistical outliers (Z > 2.5); preserves more bridges
    #    "balanced":     Uses automatic knee detection on composite bridge prominence (recommended)
    #    "aggressive":   Aggressively strips shared cross-cutting terms into enums.py
    core_separation_profile: "balanced"

    # 3. Dynamic Scale Auto-Detection
    #    true: Automatically scales absorption thresholds, min cluster floors, and
    #          agglomeration convergence based on graph size |V| and edge density rho.
    auto_scale_detection: true

    # 4. Agglomeration Similarity Threshold Override (Centroid Cosine Similarity Cutoff)
    #    - When set (uncommented): Explicitly overrides the profile preset.
    #    - To use automatic profile presets: Simply comment out this line (or set to null).
    #      Preset defaults: "macro" = 0.65, "balanced" = 0.70, "granular" = 0.75.
    agglomeration_similarity_threshold: null # Defaults to active profile preset (0.70 for balanced)

  # ----------------------------------------------------------------------------
  # SECTION 0.1: PIPELINE EXECUTION & TABULAR DIAGNOSTIC REPORTS
  # ----------------------------------------------------------------------------
  execution_mode: "community"          # Target pipeline mode: "community"
  export_tabular_reports: true         # Generate CSV diagnostics (complete graph, hubs, subgraphs, communities)
  top_n_hubs_export: 30                # Minimum hub count exported to global hub registry CSV (default: 30)


  # ----------------------------------------------------------------------------
  # SECTION 1: GLOBAL HUB & CHOKEPOINT PRUNING (Stage 3.1: Core Separation)
  # ----------------------------------------------------------------------------
  # Evaluated on the complete raw graph before modular community partitioning.
  # Concepts meeting these criteria are identified as systemic nexus points,
  # pruned from the core graph to decouple distinct thematic communities, and
  # exported to enums.py / global hub registries.
  # ----------------------------------------------------------------------------
  hub_pruning:
    # --- Topological Dispersion (Qualitative Cross-Thematic Bridging) ---
    # Participation Coefficient: P_i = 1 - sum_{s=1}^{M} (k_is / k_i)^2
    # Measures how uniformly connections are distributed across different modules:
    #   - 0.0: Perfectly intra-community (all edges within a single theme).
    #   - 1.0: Uniformly dispersed across all themes (no modular loyalty).
    participation_threshold: 0.80      # Min P_i cutoff for cross-community bridge extraction (range: [0.0, 1.0])

    # --- Structural Degree Prominence (Quantitative Volume) ---
    # A concept must have at least this total degree to qualify as a global hub.
    # On dense graphs, adaptively scales UP to the top (1 - p) percentile:
    # Formula: effective_degree = max(min_hub_degree, quantile(degrees, dynamic_hub_percentile))
    min_hub_degree: 30                 # Baseline minimum total degree required (hard floor)
    dynamic_hub_percentile: 0.98       # Degree percentile cutoff (0.98 = top 2% most connected nodes; set null to disable)

    # --- Maximum Hub Safety Ceiling ---
    # Caps the total number of extracted hubs to prevent shattering the community graph.
    # Candidates are ranked by composite prominence (P_i * degree) and capped:
    max_global_hubs: 10                # Safety cap: extracts at most top 10 global hubs (default: 10)

    # --- Workflow Chokepoints (Shortest-Path Betweenness Centrality) ---
    # Extracts bottleneck nodes that control information flow across geodesic paths
    # (Node must ALSO satisfy degree >= min_hub_degree to prevent pruning local bridges):
    betweenness_percentile: 0.98       # Centrality percentile cutoff (0.98 = top 2% betweenness in graph)
    min_betweenness_score: 0.05        # Hard absolute minimum betweenness score floor


  # ----------------------------------------------------------------------------
  # SECTION 2: COMMUNITY MODULARITY OPTIMIZATION BASELINE (Stage 3.2: Partitioning)
  # ----------------------------------------------------------------------------
  community_path:
    # Leiden Modularity Resolution Density Parameter (gamma)
    # Higher values (> 1.0) produce smaller, more cohesive sub-communities;
    # Lower values (< 1.0) produce larger, macro-thematic communities.
    leiden_resolution: 0.8


  # ----------------------------------------------------------------------------
  # SECTION 3: SEMANTIC COMMUNITY REFINEMENT & STRICT ISOLATION (Stage 3.2)
  # ----------------------------------------------------------------------------
  # Governs semantic-structural edge weighting, post-Leiden boundary refinement,
  # orphan recovery, and disjoint triplet partitioning.
  # ----------------------------------------------------------------------------
  semantic_clustering:
    # --- 3.1 Strict Quarantine Safeguards ---
    quarantine_global_hubs: true       # Immutable invariant: Pruned hubs NEVER re-enter communities
    quarantine_true_isolates: true     # Degree-0 concepts (connected only to global hubs) remain in enums

    # --- 3.2 Hybrid Semantic-Structural Edge Weighting ---
    # Modulates graph edge weights for Leiden modularity:
    #   w_eff = (1 - alpha) * w_freq + alpha * max(min_cosine_floor, cos_sim(u, v))
    enable_weighted_leiden: true
    edge_weighting_mode: "hybrid"      # "hybrid" (frequency + cosine similarity) or "frequency_only"
    hybrid_semantic_alpha: 0.50        # Weight assigned to cosine similarity (0.0 = pure frequency, 1.0 = pure cosine)
    min_cosine_floor: 0.1              # Baseline floor to prevent zero-weight edges for non-aligned pairs

    # --- 3.3 Guarded Pendant Leaf Attachment (Pass 2 Noise Defense) ---
    # Re-attaches degree-1 pendant leaves to their primary community core if semantic affinity is verified:
    enable_guarded_leaf_attachment: true
    min_leaf_attachment_similarity: 0.45 # Minimum cosine similarity to community centroid to reattach

    # --- 3.4 Centroid-Driven Micro-Cluster Absorption ---
    # Absorbs small fragmented micro-clusters into high-affinity neighboring macro-communities:
    enable_micro_cluster_absorption: true
    absorption_size_threshold: 20      # Maximum node count for candidate micro-clusters (size < threshold)
    min_absorption_similarity: 0.28    # Guardrail tau_min: Minimum centroid cosine similarity for absorption
    absorption_contrast_margin: 0.05   # Required margin over second-best candidate: sim(best) - sim(second) >= delta
    freeze_centroids_pre_absorption: true # Keep target community centroids fixed during absorption to avoid drift

    # --- 3.5 Semantic Singleton Harvesting (High-Affinity Orphan Recovery) ---
    # Recovers isolated concepts/dyads that share strong thematic alignment with an established core:
    enable_singleton_harvesting: true
    singleton_harvesting_threshold: 0.40 # High-confidence cosine similarity threshold (tau_harvest >= 0.40)
    singleton_contrast_margin: 0.05    # Required contrast margin over second-best community (delta >= 0.05)

    # --- 3.6 Guarded Semantic Refugee Realignment ---
    # Reassigns misclassified boundary nodes that exhibit stronger semantic affinity to a structural neighbor:
    enable_refugee_realignment: true
    refugee_margin_delta: 0.06         # Required excess affinity: sim(foreign) - sim(home) >= 0.06
    require_structural_neighbor: true  # Node must possess at least 1 structural graph edge to foreign community

    # --- 3.7 Hierarchical Community Agglomeration ---
    # Iteratively consolidates redundant or split communities with near-identical centroids:
    enable_community_agglomeration: true
    agglomeration_similarity_threshold: 0.70 # Centroid cosine similarity cutoff for merging communities
    max_agglomeration_passes: 15      # Iterative convergence ceiling
    center_agglomeration_embeddings: true # Subtract corpus mean vector mu to eliminate anisotropic baseline shift

    # --- 3.8 Disjoint Triplet Payload Partitioning ---
    triplet_payload_mode: "strictly_intra_only" # "include_boundary" or "strictly_intra_only"
    exclude_hub_triplets_from_communities: false # Exclude any triplet containing a global hub node


  # ----------------------------------------------------------------------------
  # SECTION 4: ARCHITECTURAL TIER PARTITIONING (Stage 3.3)
  # ----------------------------------------------------------------------------
  # Stratifies community members into 3 structural-semantic tiers:
  #   - Tier 1: Thematic Nucleus (Core Invariants)
  #   - Tier 2: Relational Mechanics (Domain Spokes)
  #   - Tier 3: Contextual Modifiers (Peripheral nuances & leaves)
  # Composite Score: S_u = (max(0, P_u))^w_proto * (D_u)^w_cent * (Gamma_u)^w_fid
  # ----------------------------------------------------------------------------
  architectural_tiers:
    enabled: true

    # --- Tri-Partite Scoring Weights ---
    weights:
      prototypicality: 0.40            # Weight for cosine similarity to community centroid (w_proto)
      centrality: 0.40                 # Weight for normalized internal community degree (w_cent)
      fidelity: 0.20                   # Weight for evidence grounding from source text quotes (w_fid)

    # --- Dynamic Percentile Thresholds & Entity Bounds ---
    tier_1_percentile: 0.80            # Top 20% scoring concepts qualify for Tier 1 Nucleus
    tier_1_min_entities: 2             # Minimum entity count guaranteed for Tier 1
    tier_1_max_entities: 8             # Maximum entity cap for Tier 1 Nucleus
    tier_2_percentile: 0.30            # Concepts from 30th to 80th percentile form Tier 2 Mechanics
    # Concepts below 30th percentile and degree-1 leaves automatically assigned to Tier 3

    # --- Grounding Quality Safeguard ---
    min_fidelity_tier_1: 0.10          # Minimum evidence fidelity required to enter Tier 1

    # --- Degree Discount & Fallback Scoring Parameters ---
    boundary_discount: 0.5             # Weight discount for cross-community edges: deg_eff = deg_int + discount * deg_bound
    fallback_prototypicality: 0.30     # Default prototypicality when node embedding is missing
    fallback_fidelity: 0.28            # Default fidelity score when edge quote evidence is missing

    # --- Human Evaluation & Reporting Exports ---
    export_tier_csv: true              # Export human-readable spreadsheet (community_architectural_tiers.csv)
    export_diagnostics: true           # Export diagnostic summary stats (tier_partitioning_diagnostics.json)


  # ----------------------------------------------------------------------------
  # SECTION 5: 3D GALAXY VISUALIZATION & MANIFOLD DE-BIASING (Stage 3.4)
  # ----------------------------------------------------------------------------
  # Governs interactive 3D UMAP/PCA hyper-space galaxy projections, centroid
  # anchoring, density hull shells, and cross-border refugee visual analytics.
  # ----------------------------------------------------------------------------
  galaxy_3d:
    # Vector de-biasing pre-processor (All-but-the-Top manifold centering):
    #   - true: Centers vector space by subtracting corpus mean vector mu and dominant
    #           anisotropic principal components, eliminating the high-dimensional cone effect.
    #   - false: Uses raw SentenceTransformer vectors directly.
    debias_embeddings: true

    # Weighting strategy for calculating 3D community centroid positions:
    #   - "core_tiers" (default): Weighted average of Tier 1 (Nuclei) and Tier 2 (Mechanics)
    #     concepts by their architectural score. Prevents peripheral leaves from distorting center.
    #   - "tier_1_only": Anchors centroids strictly to Tier 1 Thematic Nuclei.
    #   - "uniform": Standard arithmetic mean across all community concepts.
    centroid_weighting: "core_tiers"

    # Statistical boundary radius percentile (R_p) for cohesive density hulls:
    #   - 75 (default): Tight cohesive shell enclosing the core 75% of community concepts;
    #     peripheral modifiers orbit outside the hull as contextual nuance.
    #   - 85: Intermediate boundary enclosing most community concepts.
    #   - 95: Expansive boundary enclosing nearly all concepts including distant edge modifiers.
    density_hull_percentile: 75

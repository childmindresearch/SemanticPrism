# =========================================================================
# STAGE 3: GRAPH TOPOLOGY CONFIGURATION (Dual-Path Isolated Architecture)
# =========================================================================
# Controls graph partitioning, community workflow discovery, embedding
# categorizations, and HTML canvas visual rendering.
# =========================================================================

topology:
  # Execution Mode for Stage 3 Topology Pipeline
  # Options: "both" (Concurrent Leiden & Node2Vec), "community" (Leiden only), "embedding" (Node2Vec only)
  execution_mode: "both"
  # For Extracted THEMES: Threshold for discovering child -> parent theme inheritance links based on shared concepts.
  # Value range: 0.0 to 1.0 (e.g., 0.3 means a child theme must share >= 30% of its entities with a parent theme).
  # - Increase (e.g. 0.5): Stricter matching -> creates FEWER theme hierarchy links.
  # - Decrease (e.g. 0.1): Looser matching -> creates MORE theme hierarchy links.
  inheritance_overlap_threshold: 0.4


  # =========================================================================
  # PATH 1: COMMUNITY PATH (Approach A - Workflow & Event Isolation)
  # =========================================================================
  community_path:
    # Participation Coefficient (P_i) cutoff for extracting cross-community hub nodes.
    # Value range: 0.0 to 1.0 (Measures how evenly a concept bridges different themes).
    # - Increase (e.g. 0.8): Extract FEWER hubs (only concepts spanning many themes evenly).
    # - Decrease (e.g. 0.5): Extract MORE hubs (includes moderately connected concepts).
    participation_threshold: 0.65

    # Shortest-path betweenness percentile cutoff for extracting workflow chokepoints.
    # Value range: 0.0 to 1.0 (e.g. 0.95 extracts concepts in top 1 - 0.95 = 5% betweenness).
    # - Increase (e.g. 0.98): Extract FEWER hubs (only top 2% critical workflow chokepoints).
    # - Decrease (e.g. 0.90): Extract MORE hubs (top 10% workflow chokepoints).
    betweenness_percentile: 0.95

    leiden_resolution: 1.0        # Leiden modularity resolution density parameter

  # =========================================================================
  # PATH 2: EMBEDDING PATH (Approach B - Pure Category & Role Isolation)
  # =========================================================================
  embedding_path:
    # Participation Coefficient (P_i) cutoff for extracting cross-theme structural hubs.
    # - Increase (e.g. 0.6): Extract FEWER structural hubs.
    # - Decrease (e.g. 0.3): Extract MORE structural hubs.
    participation_threshold: 0.65
    enable_modularity_vitality_pruning: false # Prunes boundary-blurring nodes (Delta Q < -0.005)
    max_structural_clusters: 12              # Max K evaluated during K-Means Silhouette optimization
    node2vec_dimensions: 64                 # Vector space dimensionality for Node2Vec
    node2vec_walk_length: 8                 # Length of random walk trajectories per node
    node2vec_num_walks: 100                  # Number of random walk iterations per node

  # =========================================================================
  # VISUALIZATION RENDERING OPTIMIZATIONS (PyVis HTML Canvas Only)
  # =========================================================================
  visualizations:
    min_node_degree: 2           # Minimum node degree to render on global diagnostic HTML charts
    max_nodes_per_cluster: 30     # Max central nodes per cluster to render on global diagnostic HTML charts
    max_total_visual_nodes: 0.75 # Max nodes as fraction of total graph nodes (e.g. 0.25 = top 25%)
    freeze_physics: true         # Disable live physics engine after stabilization for smooth panning

# =========================================================================
# STAGE 4: PYDANTIC SCHEMA SYNTHESIS CONFIGURATION
# =========================================================================
# Controls target qualification, PageRank triplet payload
# pruning, and schema execution modes.
# =========================================================================

synthesis:
  # Stage 4 Synthesis Path Execution Mode
  execution_mode: "community"

  # Stage 4 Schema Pass Execution Mode
  # Options: "normalized" (taxonomically lifted triplets from refined_triplets.json), "raw" (original_triplets.json), "both"
  schema_pass_mode: "raw"

  # Entity threshold for Synthesis schema creation.
  # Clusters with < min_cluster_size entities are routed directly to Enum synthesis (enums.py).
  # Use 2 for small test datasets; 16+ for large production corpora.
  min_cluster_size: 12

  # =========================================================================
  # ENUM SEMANTIC CLUSTERING & COHESION FILTERING
  # =========================================================================
  # Controls vector-based grouping and cohesion filtering of orphan/low-density nodes
  # before passing candidate terms to Enum synthesis (Phase 1).
  enum_clustering:
    enabled: true
    # Maximum cosine distance between cluster members (0.48 distance ~ 0.52+ cosine similarity)
    distance_threshold: 0.48
    # Minimum cluster size to form a qualified Enum class (singletons discarded as noise)
    min_cluster_size: 2
    # Minimum average cosine similarity to cluster centroid to qualify as a strong cluster
    min_cohesion_score: 0.55
    # Maximum candidate clusters per LLM payload batch to prevent context window overflow
    max_clusters_per_batch: 25

  # Maximum number of triplets sent to the LLM per schema generation target.
  # Subsets exceeding this cap are pruned based on PageRank and intra-community status.
  max_triplets_per_target: 1800

  # Controls whether to save the full text payloads sent to the LLM during Stage 4 Synthesis.
  # When true, payloads are saved to the directory specified in payload_output_dir.
  save_llm_payloads: true
  payload_output_dir: "outputs/payload_text/stage_04_synthesis"

  # Specifies the item structure of Phase 2 schema synthesis payloads sent to the LLM.
  # Options:
  #   "triples"  - {'text': 'subject predicate object.', 'theme_association': ...}
  #   "raw_text" - {'text': source_quote, 'theme_association': ...}
  #   "both"     - {'triple': 'subject predicate object.', 'text': source_quote, 'theme_association': ...}
  payload_values: "raw_text"

  # Maximum number of curated source text sentences per community target payload (default: 60)
  max_sentences_per_target: 60

  # Minimum character length for source text quotes to be considered valid observations
  min_sentence_length: 15

  # Number of prominent, specific domain terms to provide in the payload (default: 12)
  top_domain_terms_count: 12

  # Stop words and generic vocabulary filtered out when deriving top domain terms
  generic_exclusions:
    - person
    - name
    - support
    - organization
    - thing
    - things
    - away
    - "-"
    - other
    - none
    - user
    - people
    - system
    - systems
    - someone
    - something
    - anyone
    - anything
    - everyone
    - everything
    - item
    - items
    - concept
    - concepts
    - state
    - states
    - data
    - info
    - information
    - value
    - values
    - lot
    - lots
    - bit
    - bits
    - day
    - days
    - time
    - times
    - year
    - years
    - week
    - weeks
    - part
    - parts
    - case
    - cases
    - type
    - types
    - category
    - categories
    - cat

pipeline:
  use_async: true
  resume_mode: "overwrite" # Options: "skip" or "overwrite"

directories:
  inputs: "inputs/testdocs"
  outputs: "outputs"

ingestion:
  source_type: "parquet" # Options: "directory" or "parquet"
  parquet:
    filename: "inputs/testdocs.parquet"
    id_field: "unique_val"
    text_field: "report"

llm:
  # --- GEMINI TESTING BLOCK ---
  # provider: "google"
  # model_name: "gemini-3.1-flash-lite"
  # base_url: ""
  # api_key: "" # Load from .env file
  # temperature: 0.0
  # manage_vram: false
  
  # --- OLLAMA ORIGINAL BLOCK (Uncomment and delete Gemini block to revert) ---
  provider: "ollama"
  model_name: "gemma4:26b"
  base_url: "http://127.0.0.1:11434/v1"
  api_key: ""
  temperature: 0.0
  manage_vram: true

extraction:
  domain: "General Subjects"
  max_async_calls: 2
  theme_chunk_max_words: 3500
  triple_chunk_max_words: 1200
  # Context Window Cap (in tokens) to optimize KV cache and prevent GPU memory overflow.
  # Note: A higher chunk size (theme_chunk_max_words or triple_chunk_max_words) or a higher
  # max_async_calls will increase VRAM consumption. Ensure:
  # (context_window_cap * max_async_calls * bytes_per_token_KV) fits in GPU VRAM.
  context_window_cap: 8192
  # Stage-specific model overrides (Optional: define separate theme and triple extraction models)
  llm_theme:
    provider: "ollama"
    model_name: "gemma4:26b"
    api_key: ""
    temperature: 0.0
  llm_triple:
    provider: "ollama"
    model_name: "gemma4:26b"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: ""
    temperature: 0.0
  llm:
    provider: "ollama"
    model_name: "gemma4:26b"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: ""
    temperature: 0.0

refinement:
  resume: true # Options: true (resume from cache) or false (start fresh and erase existing SQLite DB)
  max_async_calls: 6
  batch_size: 25
  timeout: 300.0
  embedding_model: "all-MiniLM-L6-v2"
  # Agglomerative Clustering Distance Threshold
  # Adjust this value to control how tightly or loosely nodes are grouped during taxonomic lifting.
  # Lower values (e.g., 0.5): Tighter, more precise clusters. Results in more numerous, granular categories.
  # Higher values (e.g., 0.9): Broader, looser clusters. Results in fewer, higher-level abstract categories.
  clustering_threshold: 0.6
  # Context Window Cap (in tokens) for lightweight term normalization.
  # Since batch_size is small and terms are short, a smaller context cap (e.g., 2048)
  # optimizes cache reuse and reduces memory usage.
  context_window_cap: 2048
  # Stage-specific model overrides
  llm:
    provider: "ollama"
    model_name: "gemma4:26b"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: ""
    temperature: 0.0

topology:
  # Execution Mode for Stage 3 Topology Pipeline
  # Options:
  #   - "both"      : Execute both Community Path (Approach A) and Embedding Path (Approach B) concurrently (Default).
  #   - "community"  : Execute only Path 1 (Approach A: Traditional Community Path via Leiden).
  #   - "embedding"  : Execute only Path 2 (Approach B: Embedding Path via Node2Vec).
  execution_mode: "both"
  inheritance_overlap_threshold: 0.3

  # =========================================================================
  # PATH 1: COMMUNITY PATH (Approach A - Workflow & Event Isolation)
  # =========================================================================
  # Objective: Isolate narrative workflows and clinical/event processes.
  # Hub Identification Mechanism:
  #   - Participation Coefficient (P_i): Measures multi-community edge dispersion.
  #     Nodes with P_i > threshold (e.g. 0.5) have >50% of edges outside their primary theme.
  #   - Betweenness Centrality: Identifies sequential "chokepoint" nodes bridging narrative steps.
  # Clustering Engine: Leiden Modularity Algorithm on the pruned sub-graph.
  # Output Location: outputs/03_topology/community/topology_partitions.json
  # Visualizations : outputs/visuals/community/
  # =========================================================================
  # =========================================================================
  # PATH 1: COMMUNITY PATH (Approach A - Workflow & Event Isolation)
  # =========================================================================
  # Objective: Isolate narrative workflows and clinical/event processes.
  # Hub Identification Mechanism:
  #   - Participation Coefficient (P_i): Measures multi-community edge dispersion.
  #   - Betweenness Centrality: Identifies sequential "chokepoint" nodes bridging narrative steps.
  # Clustering Engine: Leiden Modularity Algorithm on the pruned sub-graph.
  # Output Location: outputs/03_topology/community/topology_partitions.json
  # Visualizations : outputs/visuals/community/
  # =========================================================================
  community_path:
    # participation_threshold: Cutoff for cross-community hubs (P_i in [0, 1]).
    #   - INCREASING (e.g. 0.70-0.80): Prunes FEWER hubs (only super-connectors spanning 3+ themes). Graph stays connected -> Leiden yields FEWER, LARGER workflow modules (richer LLM context).
    #   - DECREASING (e.g. 0.40-0.50): Prunes MORE hubs (includes 2-theme connectors). Graph breaks into MORE, SMALLER micro-communities (granular schemas).
    participation_threshold: 0.65

    # betweenness_percentile: Shortest-path narrative chokepoint cutoff.
    #   - INCREASING (e.g. 0.95-0.98): Selects top 2-5% highest betweenness nodes as hubs -> FEWER chokepoints pruned, preserving connected workflow steps inside clusters.
    #   - DECREASING (e.g. 0.80-0.90): Selects top 10-20% chokepoints as hubs -> MORE transition nodes pruned, isolating procedural sub-steps into separate micro-modules.
    betweenness_percentile: 0.95

    # leiden_resolution: Leiden modularity resolution density parameter.
    #   - INCREASING (e.g. 1.5-2.0): Forces Leiden to discover SMALLER, tighter sub-communities (denser micro-workflows).
    #   - DECREASING (e.g. 0.5-0.8): Forces Leiden to merge sub-communities into LARGER macro-workflow modules.
    leiden_resolution: 1.0

  # =========================================================================
  # PATH 2: EMBEDDING PATH (Approach B - Pure Category & Role Isolation)
  # =========================================================================
  # Objective: Isolate pure, decoupled ontological categories and structural roles.
  # Hub Identification Mechanism:
  #   - Participation Coefficient (P_i): Measures multi-theme edge dispersion across categories.
  #   - Modularity Vitality (Delta Q): Prunes nodes whose presence lowers global modularity (Delta Q < -0.005),
  #     maximizing structural cluster isolation.
  # Clustering Engine: Node2Vec 64D random-walk embeddings + dynamic K-Means Silhouette optimization.
  # Output Location: outputs/03_topology/embedding/topology_partitions.json
  # Visualizations : outputs/visuals/embedding/
  # =========================================================================
  embedding_path:
    # participation_threshold: Cutoff for cross-theme structural hubs (P_i in [0, 1]).
    #   - INCREASING (e.g. 0.70-0.80): Prunes FEWER hubs before Node2Vec, capturing broader structural relationships in vector space.
    #   - DECREASING (e.g. 0.40-0.50): Prunes MORE multi-theme nodes, isolating pure category clusters in vector space.
    participation_threshold: 0.45

    # enable_modularity_vitality_pruning: Toggles pruning of boundary-blurring nodes (Delta Q < -0.005).
    #   - TRUE : Identifies nodes whose removal INCREASES modularity Q, forcing clean category separation.
    #   - FALSE: Retains boundary-blurring nodes inside structural clusters.
    enable_modularity_vitality_pruning: true

    # max_structural_clusters: Maximum K evaluated during K-Means Silhouette optimization search.
    #   - INCREASING (e.g. 15-20): Allows evaluation of higher cluster counts for large, fine-grained entity taxonomies.
    #   - DECREASING (e.g. 5-8) : Restricts search to low cluster counts for coarse, high-level entity categories.
    max_structural_clusters: 12

    # node2vec_dimensions: Vector space dimensionality for Node2Vec embeddings. (e.g., 32,64,128)
    #   - INCREASING (e.g. 128): Expands vector capacity for complex topological role representations on massive graphs (>10k nodes).
    #   - DECREASING (e.g. 32) : Reduces vector dimensionality for fast embedding convergence on smaller graphs (<500 nodes).
    node2vec_dimensions: 128

    # node2vec_walk_length: Length of random walk trajectories per node.
    #   - INCREASING (e.g. 15-20): Deepens structural neighborhood exploration per walk trajectory.
    node2vec_walk_length: 10

    # node2vec_num_walks: Number of random walk iterations per node.
    #   - INCREASING (e.g. 150-200): Increases sampling density, producing highly deterministic, stable cluster boundaries.
    node2vec_num_walks: 100

  # =========================================================================
  # VISUALIZATION RENDERING OPTIMIZATIONS (PyVis HTML Canvas Only)
  # =========================================================================
  # Controls visual pruning and rendering performance for global diagnostic HTML files ONLY
  # (e.g. interactive_topology_graph, interactive_communities_only, interactive_workflow_narratives).
  #
  # NOTE: These parameters do NOT apply to 'interactive_llm_payload_gallery.html' nor
  # 'interactive_collapsed_modules.html', which ALWAYS represent 100% of the raw 
  # topology partitions passed to Stage 4 for schema synthesis.
  # Has 0% impact on JSON outputs or Stage 4 schema generation.
  # =========================================================================
  visualizations:
    min_node_degree: 3           # Minimum node degree to render on global diagnostic HTML charts (e.g. 3 omits low-degree leaf nodes; 0 = show all)
    max_nodes_per_cluster: 30     # Max central nodes per cluster to render on global diagnostic HTML charts (0 = unlimited)
    max_total_visual_nodes: 0.25 # Max nodes to render as a fraction of total graph nodes on global diagnostic HTML charts (e.g. 0.25 = top 25%; >1 = hard integer cap; 0 = show all)
    freeze_physics: true         # Disable live physics engine after stabilization for smooth 60 FPS browser panning

synthesis:
  # Stage 4 Synthesis Path Execution Mode
  # Options:
  #   - "community"  : Synthesize Path 1 workflow schemas from outputs/03_topology/community/ (Default).
  #   - "embedding"  : Synthesize Path 2 categorical schemas from outputs/03_topology/embedding/.
  #   - "both"       : Synthesize both Path 1 and Path 2 schemas in sequence.
  execution_mode: "community"

  # Stage 4 Schema Pass Execution Mode
  # Options:
  #   - "normalized" : Synthesize normalized schemas from refined_triplets.json (Pass A).
  #   - "raw"        : Synthesize raw unwound schemas from original_triplets.json (Pass B).
  #   - "both"       : Synthesize both normalized and raw schema passes (Default).
  schema_pass_mode: "normalized"

  max_async_calls: 3

  # Entity threshold for Stage 4 target qualification (Default: 5).
  # Communities/clusters with < 5 entities are filtered from individual schema extraction
  # and their entities are routed directly to Phase 1 Enum synthesis (enums.py) so zero data is lost.
  min_cluster_size: 32
  # Maximum number of global hub nodes to process as individual schema targets.
  # Hubs exceeding this limit are routed directly to Phase 1 Enum synthesis (enums.py)
  # to prevent database schema bloat on large-scale datasets.
  max_hub_targets: 4
  # Maximum number of triplets to send to the LLM per schema generation target.
  # Subsets exceeding this cap are pruned based on PageRank and community status
  # to prevent token window overflow and model confusion on dense graphs.
  max_triplets_per_target: 1200
  # Context Window Cap (in tokens) for schema generation and consolidation.
  # Consolidation parses multiple Python file schemas, which can grow large.
  # Set higher (e.g., 16384) to prevent truncation of target schemas.
  context_window_cap: 16384
  # Stage-specific model overrides
  llm:
    provider: "ollama"
    model_name: "SemP16k-Qwen122:latest" #"gemma4:26b"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: ""
    temperature: 0.0


pipeline:
  use_async: true
  resume_mode: "overwrite" # Options: "skip" or "overwrite"

directories:
  inputs: "inputs/testdocs"
  outputs: "outputs"

ingestion:
  source_type: "parquet" # Options: "directory" or "parquet"
  parquet:
    filename: "inputs/testdocs.parquet"
    id_field: "unique_val"
    text_field: "report"

llm:
  # --- GEMINI TESTING BLOCK ---
  # provider: "google"
  # model_name: "gemini-3.1-flash-lite"
  # base_url: ""
  # api_key: "" # Load from .env file
  # temperature: 0.0
  # manage_vram: false
  
  # --- OLLAMA ORIGINAL BLOCK (Uncomment and delete Gemini block to revert) ---
  provider: "ollama"
  model_name: "gemma4:26b"
  base_url: "http://127.0.0.1:11434/v1"
  api_key: ""
  temperature: 0.0
  manage_vram: true

extraction:
  domain: "General Subjects"
  max_async_calls: 2
  theme_chunk_max_words: 3500
  triple_chunk_max_words: 1200
  # Context Window Cap (in tokens) to optimize KV cache and prevent GPU memory overflow.
  # Note: A higher chunk size (theme_chunk_max_words or triple_chunk_max_words) or a higher
  # max_async_calls will increase VRAM consumption. Ensure:
  # (context_window_cap * max_async_calls * bytes_per_token_KV) fits in GPU VRAM.
  context_window_cap: 8192
  # Stage-specific model overrides (Optional: define separate theme and triple extraction models)
  llm_theme:
    provider: "ollama"
    model_name: "gemma4:26b"
    api_key: ""
    temperature: 0.0
  llm_triple:
    provider: "ollama"
    model_name: "gemma4:26b"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: ""
    temperature: 0.0
  llm:
    provider: "ollama"
    model_name: "gemma4:26b"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: ""
    temperature: 0.0

refinement:
  resume: true # Options: true (resume from cache) or false (start fresh and erase existing SQLite DB)
  max_async_calls: 6
  batch_size: 25
  timeout: 300.0
  embedding_model: "all-MiniLM-L6-v2"
  # Agglomerative Clustering Distance Threshold
  # Adjust this value to control how tightly or loosely nodes are grouped during taxonomic lifting.
  # Lower values (e.g., 0.5): Tighter, more precise clusters. Results in more numerous, granular categories.
  # Higher values (e.g., 0.9): Broader, looser clusters. Results in fewer, higher-level abstract categories.
  clustering_threshold: 0.6
  # Context Window Cap (in tokens) for lightweight term normalization.
  # Since batch_size is small and terms are short, a smaller context cap (e.g., 2048)
  # optimizes cache reuse and reduces memory usage.
  context_window_cap: 2048
  # Stage-specific model overrides
  llm:
    provider: "ollama"
    model_name: "gemma4:26b"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: ""
    temperature: 0.0

topology:
  # Execution Mode for Stage 3 Topology Pipeline
  # Options:
  #   - "both"      : Execute both Community Path (Approach A) and Embedding Path (Approach B) concurrently (Default).
  #   - "community"  : Execute only Path 1 (Approach A: Traditional Community Path via Leiden).
  #   - "embedding"  : Execute only Path 2 (Approach B: Embedding Path via Node2Vec).
  execution_mode: "both"
  inheritance_overlap_threshold: 0.3

  # =========================================================================
  # PATH 1: COMMUNITY PATH (Approach A - Workflow & Event Isolation)
  # =========================================================================
  # Objective: Isolate narrative workflows and clinical/event processes.
  # Hub Identification Mechanism:
  #   - Participation Coefficient (P_i): Measures multi-community edge dispersion.
  #     Nodes with P_i > threshold (e.g. 0.5) have >50% of edges outside their primary theme.
  #   - Betweenness Centrality: Identifies sequential "chokepoint" nodes bridging narrative steps.
  # Clustering Engine: Leiden Modularity Algorithm on the pruned sub-graph.
  # Output Location: outputs/03_topology/community/topology_partitions.json
  # Visualizations : outputs/visuals/community/
  # =========================================================================
  community_path:
    participation_threshold: 0.65     # Participation Coefficient cutoff (P_i >= 0.65). Higher value restricts hub status to 3+ theme connectors, preventing over-fragmentation into tiny micro-clusters.
    betweenness_percentile: 0.95     # Top 5% betweenness centrality cutoff (0.95). Identifies key narrative transition chokepoints while keeping internal workflow steps intact.
    leiden_resolution: 1.0           # Leiden clustering resolution parameter (1.0 = standard modularity density).

  # =========================================================================
  # PATH 2: EMBEDDING PATH (Approach B - Pure Category & Role Isolation)
  # =========================================================================
  # Objective: Isolate pure, decoupled ontological categories and structural roles.
  # Hub Identification Mechanism:
  #   - Participation Coefficient (P_i): Measures multi-theme edge dispersion across categories.
  #   - Modularity Vitality (Delta Q): Prunes nodes whose presence lowers global modularity (Delta Q < -0.005),
  #     maximizing structural cluster isolation.
  # Clustering Engine: Node2Vec 64D random-walk embeddings + dynamic K-Means Silhouette optimization.
  # Output Location: outputs/03_topology/embedding/topology_partitions.json
  # Visualizations : outputs/visuals/embedding/
  # =========================================================================
  embedding_path:
    participation_threshold: 0.65                 # Participation Coefficient cutoff (P_i >= 0.65). Restricts structural hub pruning to multi-domain super-connectors.
    enable_modularity_vitality_pruning: true    # Prune boundary-blurring nodes with negative modularity vitality (Delta Q < -0.005) to force category separation.
    max_structural_clusters: 12                 # Maximum K evaluated during K-Means Silhouette search (finds optimal K between 2 and 12).
    node2vec_dimensions: 64                     # Embedding vector space dimensions (64D captures complex topological role equivalence).
    node2vec_walk_length: 10                    # Length of random walk trajectories per node.
    node2vec_num_walks: 100                     # Total random walk iterations per node for stable embedding convergence.

  # =========================================================================
  # VISUALIZATION RENDERING OPTIMIZATIONS (PyVis HTML Canvas Only)
  # =========================================================================
  # Controls visual pruning and rendering performance for HTML files ONLY.
  # Has 0% impact on JSON outputs or Stage 4 schema generation.
  # =========================================================================
  visualizations:
    min_node_degree: 3           # Minimum node degree to render on HTML canvas (e.g. 3 omits low-degree leaf nodes; 0 = show all)
    max_nodes_per_cluster: 30     # Max central nodes per cluster to render in HTML (0 = unlimited)
    max_total_visual_nodes: 0.25 # Max nodes to render as a fraction of total graph nodes (e.g. 0.25 = top 25%; >1 = hard integer cap; 0 = show all)
    freeze_physics: true         # Disable live physics engine after stabilization for smooth 60 FPS browser panning

synthesis:
  max_async_calls: 3
  clustering_strategy: "node2vec" # Options: "leiden" or "node2vec"
  min_cluster_size: 3
  # Context Window Cap (in tokens) for schema generation and consolidation.
  # Consolidation parses multiple Python file schemas, which can grow large.
  # Set higher (e.g., 16384) to prevent truncation of target schemas.
  context_window_cap: 16384
  # Stage-specific model overrides
  llm:
    provider: "ollama"
    model_name: "gemma4:26b" # "gemma4:26b"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: ""
    temperature: 0.0

